name: Release DMG & Auto-Update Assets

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install xcodegen sevenzip

      - name: Run WenBarCore tests
        run: cd Packages/WenBarCore && swift test

      - name: Import signing certificate (optional)
        env:
          P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          if [ -n "$P12_BASE64" ] && [ -n "$P12_PASSWORD" ] && [ -n "$SIGNING_IDENTITY" ]; then
            KEYCHAIN_PATH="$RUNNER_TEMP/wenbar-signing.keychain-db"
            P12_PATH="$RUNNER_TEMP/wenbar-signing.p12"
            echo "$P12_BASE64" | base64 --decode > "$P12_PATH"
            KEYCHAIN_PASS="$(openssl rand -hex 16)"
            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
            rm -f "$P12_PATH"
            echo "DEVELOPER_ID=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
            echo "Loaded persistent signing identity: $SIGNING_IDENTITY"
          else
            echo "DEVELOPER_ID=-" >> "$GITHUB_ENV"
            echo "No persistent signing secrets configured; falling back to ad-hoc signature (-)."
          fi

      - name: Build DMG and ZIP packages
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            CLEAN_VERSION="${GITHUB_REF_NAME#v}"
          else
            CLEAN_VERSION="$(awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' project.yml)"
            CLEAN_VERSION="${CLEAN_VERSION:-1.0.0}"
          fi
          BUILD_NUMBER="$(awk -F'"' '/CURRENT_PROJECT_VERSION:/ { print $2; exit }' project.yml)"
          BUILD_NUMBER="${BUILD_NUMBER:-${{ github.run_number }}}"
          BUILD_NUMBER="$BUILD_NUMBER" bash scripts/package-dmg.sh "$CLEAN_VERSION"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WenBar-*.dmg
            dist/WenBar-*.zip
          generate_release_notes: true
          body: |
            ### 📦 安装与首次打开必读

            1. 下载下方 **`WenBar-*.dmg`**，打开后将 **`WenBar.app`** 拖入 **`Applications（应用程序）`** 文件夹（不要直接在 DMG 内运行，否则无法自动更新）。
            2. 由于开源构建未购买 Apple 付费公证签名，首次打开若提示“已损坏”或“无法验证开发者”，在终端执行一次以下命令即可正常打开（点击代码块右上角可直接复制）：

            ```bash
            xattr -dr com.apple.quarantine "/Applications/WenBar.app"
            ```

            3. 首次启动请按引导页提示开启 **Finder 扩展**（系统设置 → 登录项与扩展 → Finder 扩展 → 勾选 **WenBarFinderSync**）及日历/提醒事项/通知权限。
            4. **后续更新免折腾**：安装到 `/Applications` 后，以后每次发布新版本直接在软件内点击 **「检查更新 → 下载并安装重启」** 即可自动更新并清除隔离属性，无需再次手动下载或敲命令。
