name: Release DMG & Auto-Update Assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install xcodegen sevenzip

      - name: Run WenBarCore tests
        run: cd Packages/WenBarCore && swift test

      - name: Build DMG and ZIP packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          CLEAN_VERSION="${VERSION#v}"
          bash scripts/package-dmg.sh "$CLEAN_VERSION"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WenBar-*.dmg
            dist/WenBar-*.zip
          generate_release_notes: true
