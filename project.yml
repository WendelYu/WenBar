name: WenBar
options:
  bundleIdPrefix: com.wenbar
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  WenBarCore:
    path: Packages/WenBarCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    AD_HOC_CODE_SIGNING_ALLOWED: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  WenBar:
    type: application
    platform: macOS
    sources:
      - path: WenBar
        excludes:
          - "Info.plist"
          - "WenBar.entitlements"
          - "Resources/bin"
      - path: WenBar/Resources/bin
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenbar.app
        INFOPLIST_FILE: WenBar/Info.plist
        CODE_SIGN_ENTITLEMENTS: WenBar/WenBar.entitlements
        MARKETING_VERSION: "1.0.4"
        CURRENT_PROJECT_VERSION: "5"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: WenBarCore
      - target: WenBarFinderSync
        embed: true
      - sdk: Carbon.framework
      - sdk: DiskArbitration.framework
      - sdk: EventKit.framework
  WenBarFinderSync:
    type: app-extension
    platform: macOS
    sources:
      - path: WenBarFinderSync
        excludes:
          - "Info.plist"
          - "WenBarFinderSync.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenbar.app.FinderSync
        INFOPLIST_FILE: WenBarFinderSync/Info.plist
        CODE_SIGN_ENTITLEMENTS: WenBarFinderSync/WenBarFinderSync.entitlements
        MARKETING_VERSION: "1.0.4"
        CURRENT_PROJECT_VERSION: "5"
        SKIP_INSTALL: YES
    dependencies:
      - package: WenBarCore
      - sdk: FinderSync.framework
